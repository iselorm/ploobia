name: verify

# Cloudflare Pages deploys on push via its own Git integration. This workflow
# is the gate that tells you whether the thing it just deployed is sound —
# typecheck, build both halves, then drive every cabinet in a real browser.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install
        run: |
          npm ci || npm install
          npm ci --prefix app || npm install --prefix app
          npm install --prefix site

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the deploy bundle
        env:
          # The suites assert on the shipped build, so build it the way the
          # pilot ships it — including the report tab, which has collided with
          # cabinet controls before.
          PLOOBIA_BUILD: ${{ github.sha }}
          VITE_PILOT: '1'
        run: npm run build

      - name: Verify every cabinet
        run: npm run verify

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-screenshots
          path: app/shots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ploobia-bundle
          path: dist/
          retention-days: 14
